<!DOCTYPE html>
<html lang="zh">
<head>

<style>

    --accent:    #7b9ef5;

  }

    :root:not([data-theme="dark"]) {
      --bg:        #f0f2fa;
      --surface:   #ffffff;
      --elevated:  #e6eaf8;
      --active:    #dce5ff;
      --accent:    #4166e8;
      --accent-dim: rgba(65,102,232,0.1);
      --text:      #111827;
      --text-muted:#6b7a9e;
      --border:    #c8d0ea;
      --loop-on:   #3555d0;
    }

  :root[data-theme="light"] {
    --bg:        #f0f2fa;
    --surface:   #ffffff;
    --elevated:  #e6eaf8;
    --active:    #dce5ff;
    --accent:    #4166e8;
    --accent-dim: rgba(65,102,232,0.1);
    --text:      #111827;
    --text-muted:#6b7a9e;
    --border:    #c8d0ea;
    --loop-on:   #3555d0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }
  .topbar-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--elevated);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--active); border-color: var(--accent); }
  .btn.active { background: var(--loop-on); border-color: var(--accent); color: #fff; }

  /* ── Main layout ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Video column ── */
  .video-col {
    display: flex;
    flex-direction: column;
    flex: 1 1 60%;
    min-width: 0;
    background: #000;
    position: relative;
  }
  .video-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    min-height: 0;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* current subtitle bar */
  .sub-display {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }

    font-family: 'Lora', Georgia, serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--text);
  }
  .sub-zh {
    font-size: 14px;
    line-height: 1.5;
    color: var(--accent);
    font-weight: 500;
  }
  .sub-empty {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* video controls */
  .vid-controls {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .vid-controls button {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: color .12s;
  }
  .vid-controls button:hover { color: var(--text); }
  .progress-wrap {
    flex: 1;
    height: 4px;
    background: var(--elevated);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width .1s linear;
  }
  .time-label {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ── Subtitle list column ── */
  .sub-col {
    width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow: hidden;
  }
  .sub-col-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .sub-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
    scroll-behavior: smooth;
  }
  .sub-list::-webkit-scrollbar { width: 4px; }
  .sub-list::-webkit-scrollbar-track { background: transparent; }
  .sub-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sub-item {
    padding: 10px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background .1s, border-color .12s;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sub-item:hover { background: var(--elevated); }
  .sub-item.active {
    background: var(--active);
    border-left-color: var(--accent);
  }
  .sub-item-time {
    font-size: 10px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
  }
  .sub-item-en {
    font-family: 'Lora', Georgia, serif;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
  }
  .sub-item.active .sub-item-en { color: var(--text); }
  .sub-item-zh {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .sub-item.active .sub-item-zh { color: var(--accent); }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .main { flex-direction: column; }
    .sub-col { width: 100%; height: 40vh; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>

// State
let currentIdx = -1;
let loopActive = false;
let showEn = true;
let showZh = true;
const speeds = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2.0];
let speedIdx = 2;

// Elements
const video       = document.getElementById('video');
const subDisplay  = document.getElementById('sub-display');
const subList     = document.getElementById('sub-list');
const btnPlay     = document.getElementById('btn-play');
const iconPlay    = document.getElementById('icon-play');
const iconPause   = document.getElementById('icon-pause');
const btnLoop     = document.getElementById('btn-loop');
const btnEn       = document.getElementById('btn-en');
const btnZh       = document.getElementById('btn-zh');
const btnSpeed    = document.getElementById('btn-speed');
const progressWrap= document.getElementById('progress-wrap');
const progressFill= document.getElementById('progress-fill');
const timeLabel   = document.getElementById('time-label');

// Build subtitle list
subtitles.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'sub-item';
  el.dataset.idx = i;
  el.innerHTML = `
    <span class="sub-item-time">${fmt(s.start)}</span>
    <span class="sub-item-en">${s.en}</span>
    <span class="sub-item-zh">${s.zh}</span>
  `;
  el.addEventListener('click', () => {
    video.currentTime = s.start;
    if (video.paused) video.play();
  });
  subList.appendChild(el);
});

function fmt(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}
function fmtFull(sec) {
  if (!isFinite(sec)) return '0:00';
  return fmt(sec);
}

// Time update
video.addEventListener('timeupdate', () => {
  const t = video.currentTime;

  // Progress bar
  if (video.duration) {
    progressFill.style.width = (t / video.duration * 100) + '%';
    timeLabel.textContent = fmtFull(t) + ' / ' + fmtFull(video.duration);
  }

  // Find current subtitle
  let found = -1;
  for (let i = 0; i < subtitles.length; i++) {
    if (t >= subtitles[i].start && t < subtitles[i].end) { found = i; break; }
  }

  // Loop mode
  if (loopActive && currentIdx >= 0 && found !== currentIdx && t >= subtitles[currentIdx].end) {
    video.currentTime = subtitles[currentIdx].start;
    return;
  }

  if (found === currentIdx) return;
  currentIdx = found;
  updateSubtitleUI();
});

function updateSubtitleUI() {
  // Update display panel
  if (currentIdx < 0) {
    subDisplay.innerHTML = '<span class="sub-empty">字幕将在此处显示</span>';
  } else {
    const s = subtitles[currentIdx];
    let html = '';
    if (showEn) html += `<div class="sub-en">${s.en}</div>`;
    if (showZh) html += `<div class="sub-zh">${s.zh}</div>`;
    subDisplay.innerHTML = html || '<span class="sub-empty">字幕已隐藏</span>';
  }

  // Update list
  document.querySelectorAll('.sub-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
    const enEl = el.querySelector('.sub-item-en');
    const zhEl = el.querySelector('.sub-item-zh');
    if (enEl) enEl.style.display = showEn ? '' : 'none';
    if (zhEl) zhEl.style.display = showZh ? '' : 'none';
  });

  // Auto-scroll list
  if (currentIdx >= 0) {
    const activeEl = subList.children[currentIdx];
    if (activeEl) {
      activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

// Show/hide toggle buttons
function updateVisibility() {
  document.querySelectorAll('.sub-item-en').forEach(el => el.style.display = showEn ? '' : 'none');
  document.querySelectorAll('.sub-item-zh').forEach(el => el.style.display = showZh ? '' : 'none');
  updateSubtitleUI();
}

btnEn.addEventListener('click', () => {
  showEn = !showEn;
  btnEn.classList.toggle('active', !showEn);
  updateVisibility();
});
btnZh.addEventListener('click', () => {
  showZh = !showZh;
  btnZh.classList.toggle('active', !showZh);
  updateVisibility();
});

// Loop
btnLoop.addEventListener('click', () => {
  loopActive = !loopActive;
  btnLoop.classList.toggle('active', loopActive);
});

// Play/pause
btnPlay.addEventListener('click', () => {
  if (video.paused) video.play(); else video.pause();
});
video.addEventListener('play', () => {
  iconPlay.style.display = 'none';
  iconPause.style.display = '';
});
video.addEventListener('pause', () => {
  iconPlay.style.display = '';
  iconPause.style.display = 'none';
});

// Speed
btnSpeed.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  video.playbackRate = speeds[speedIdx];
  btnSpeed.textContent = speeds[speedIdx] + '×';
});

// Progress seek
progressWrap.addEventListener('click', e => {
  if (!video.duration) return;
  const rect = progressWrap.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  video.currentTime = ratio * video.duration;
});

// ── Video source loading ──
// Bug fix: filename must include the space: "彼得兔 树花.mp4"
const ITEM_ID  = '20260901_20260901_0054';
const FILENAME = '树花 彼得兔.mp4';
const DIRECT   = 'https://archive.org/download/' + ITEM_ID + '/' + encodeURIComponent(FILENAME);

// Set direct URL immediately so the video starts loading without waiting for metadata API
video.src = DIRECT;

// Also try the metadata API: if it succeeds it gives a CDN URL (faster, more mobile-friendly)
fetch('https://archive.org/metadata/' + ITEM_ID)
  .then(r => r.json())
  .then(data => {
    if (data.server && data.dir) {
      const cdnUrl = 'https://' + data.server + data.dir + '/' + encodeURIComponent(FILENAME);
      // Switch only if video hasn't started playing yet
      if (video.paused && video.readyState < 3) {
        video.src = cdnUrl;
      }
    }
  })
  .catch(() => { /* direct URL already set, nothing to do */ });

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (video.paused) video.play(); else video.pause(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); video.currentTime += 5; }
  if (e.code === 'ArrowLeft')  { e.preventDefault(); video.currentTime -= 5; }
  if (e.code === 'KeyL') { btnLoop.click(); }
  if (e.code === 'KeyR' && currentIdx >= 0) { video.currentTime = subtitles[currentIdx].start; }
});
</script>
