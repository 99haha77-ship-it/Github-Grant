<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彼得兔 树花</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:        #0c0e1a;
    --surface:   #13172c;
    --elevated:  #1b2040;
    --active:    #1e2d58;
    --accent:    #7b9ef5;
    --accent-dim: rgba(123,158,245,0.13);
    --text:      #dce3f7;
    --text-muted:#6b7a9e;
    --border:    #242d50;
    --loop-on:   #3d5fd4;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:        #f0f2fa;
      --surface:   #ffffff;
      --elevated:  #e6eaf8;
      --active:    #dce5ff;
      --accent:    #4166e8;
      --accent-dim: rgba(65,102,232,0.1);
      --text:      #111827;
      --text-muted:#6b7a9e;
      --border:    #c8d0ea;
      --loop-on:   #3555d0;
    }
  }
  :root[data-theme="light"] {
    --bg:        #f0f2fa;
    --surface:   #ffffff;
    --elevated:  #e6eaf8;
    --active:    #dce5ff;
    --accent:    #4166e8;
    --accent-dim: rgba(65,102,232,0.1);
    --text:      #111827;
    --text-muted:#6b7a9e;
    --border:    #c8d0ea;
    --loop-on:   #3555d0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }
  .topbar-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .topbar-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--elevated);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--active); border-color: var(--accent); }
  .btn.active { background: var(--loop-on); border-color: var(--accent); color: #fff; }

  .file-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: .02em;
    transition: background .15s;
  }
  .file-label:hover { background: rgba(123,158,245,.22); }
  #file-input { display: none; }

  /* ── Main layout ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Video column ── */
  .video-col {
    display: flex;
    flex-direction: column;
    flex: 1 1 60%;
    min-width: 0;
    background: #000;
    position: relative;
  }
  .video-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    min-height: 0;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .drop-zone {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .drop-zone svg { opacity: .4; }
  .drop-zone p { font-size: 14px; opacity: .7; }
  .drop-zone small { font-size: 12px; opacity: .45; }
  .drop-zone.hidden { display: none; }

  /* current subtitle bar */
  .sub-display {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .sub-en {
    font-family: 'Lora', Georgia, serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--text);
  }
  .sub-zh {
    font-size: 14px;
    line-height: 1.5;
    color: var(--accent);
    font-weight: 500;
  }
  .sub-empty {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* video controls */
  .vid-controls {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .vid-controls button {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: color .12s;
  }
  .vid-controls button:hover { color: var(--text); }
  .progress-wrap {
    flex: 1;
    height: 4px;
    background: var(--elevated);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width .1s linear;
  }
  .time-label {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ── Subtitle list column ── */
  .sub-col {
    width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow: hidden;
  }
  .sub-col-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .sub-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
    scroll-behavior: smooth;
  }
  .sub-list::-webkit-scrollbar { width: 4px; }
  .sub-list::-webkit-scrollbar-track { background: transparent; }
  .sub-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sub-item {
    padding: 10px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background .1s, border-color .12s;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sub-item:hover { background: var(--elevated); }
  .sub-item.active {
    background: var(--active);
    border-left-color: var(--accent);
  }
  .sub-item-time {
    font-size: 10px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
  }
  .sub-item-en {
    font-family: 'Lora', Georgia, serif;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
  }
  .sub-item.active .sub-item-en { color: var(--text); }
  .sub-item-zh {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .sub-item.active .sub-item-zh { color: var(--accent); }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .main { flex-direction: column; }
    .sub-col { width: 100%; height: 40vh; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">

  <div class="topbar-controls">

        <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="time-label" id="time-label">0:00 / 0:00</span>
      <button id="btn-speed" title="播放速度" style="font-size:12px;padding:4px 8px;font-family:inherit;font-weight:500;border:1px solid var(--border);border-radius:4px;background:var(--elevated);color:var(--text-muted);">1×</button>
    </div>
  </div>

  <!-- Subtitle list -->
  <div class="sub-col">
    <div class="sub-col-header">台词列表 · 46句</div>
    <div class="sub-list" id="sub-list"></div>
  </div>

</div>

<script>
const subtitles = [
  { id:1,  start:1.000,   end:3.000,   en:"Blossoms!",                                        zh:"花儿！" },
  { id:2,  start:7.000,   end:8.968,   en:"Springtime brought lots of new things",             zh:"春天带来了许多新鲜事物，" },
  { id:3,  start:8.968,   end:10.138,  en:"for Little Field Mouse",                            zh:"给小田鼠" },
  { id:4,  start:10.138,  end:12.000,  en:"and Little Nut Brown Hare to enjoy.",               zh:"和小棕兔享受。" },

  { id:7,  start:22.000,  end:23.000,  en:"Got it!",                                           zh:"抓到了！" },
  { id:8,  start:23.000,  end:24.260,  en:"Even Little Nut Brown",                             zh:"就连小棕" },
  { id:9,  start:24.260,  end:26.000,  en:"Hare's father was having fun.",                     zh:"兔的爸爸也玩得很开心。" },
  { id:10, start:26.000,  end:28.000,  en:"Here comes another leaf!",                          zh:"又来一片叶子！" },
  { id:11, start:30.000,  end:32.000,  en:"It's coming straight to me!",                       zh:"它直接朝我飘来了！" },
  { id:12, start:35.000,  end:37.000,  en:"Oh, I didn't get it!",                              zh:"哦，我没抓到！" },
  { id:13, start:37.000,  end:38.846,  en:"Never mind Little Field Mouse,",                    zh:"没关系，小田鼠，" },
  { id:14, start:38.846,  end:41.000,  en:"I'll send you an extra special one.",               zh:"我再给你送一片特别的。" },
  { id:15, start:42.000,  end:45.000,  en:"Something pretty, something pretty.",               zh:"要找漂亮的，要找漂亮的。" },
  { id:16, start:46.000,  end:48.000,  en:"What about that blossom?",                          zh:"那朵花怎么样？" },
  { id:17, start:48.000,  end:49.212,  en:"Do you think Little",                               zh:"你觉得小" },
  { id:18, start:49.212,  end:51.000,  en:"Field Mouse would like that?",                      zh:"田鼠会喜欢吗？" },
  { id:19, start:51.000,  end:52.000,  en:"Perfect!",                                          zh:"完美！" },
  { id:20, start:52.000,  end:53.500,  en:"What's perfect?",                                   zh:"什么完美？" },
  { id:21, start:53.500,  end:54.000,  en:"What?",                                             zh:"什么呀？" },
  { id:22, start:55.000,  end:57.000,  en:"Just wait there, you'll see.",                      zh:"等着瞧就知道了。" },
  { id:23, start:60.000,  end:62.000,  en:"Ooh, it's pink!",                                   zh:"哇，是粉色的！" },
  { id:24, start:67.000,  end:69.800,  en:"Oh thank you Little Nut Brown Hare,",               zh:"谢谢你，小棕兔，" },
  { id:25, start:69.800,  end:71.000,  en:"it's so pretty!",                                   zh:"太漂亮了！" },
  { id:26, start:72.000,  end:73.000,  en:"It's a blossom!",                                   zh:"是一朵花！" },
  { id:27, start:73.000,  end:77.000,  en:"I'm going to keep it forever and ever!",            zh:"我要永远永远珍藏它！" },
  { id:28, start:78.000,  end:81.000,  en:"Oh look, here comes some more blossoms!",           zh:"快看，又来了更多花瓣！" },
  { id:29, start:84.000,  end:86.000,  en:"Where are they coming from?",                       zh:"它们从哪里漂来的？" },

  { id:31, start:88.437,  end:89.374,  en:"into the stream",                                   zh:"落入小溪，" },
  { id:32, start:89.374,  end:92.000,  en:"and the stream is floating them down here.",        zh:"被水流冲到这里来的。" },
  { id:33, start:93.000,  end:97.000,  en:"Wow, a whole tree covered in those blossoms!",      zh:"哇，整棵树都开满了花！" },
  { id:34, start:97.000,  end:100.000, en:"It must be a very pretty tree!",                    zh:"那一定是棵非常美丽的树！" },
  { id:35, start:100.000, end:103.389, en:"I can remember seeing a beautiful blossom tree",    zh:"我还记得看过一棵美丽的花树，" },
  { id:36, start:103.389, end:105.967, en:"when I was a Little Nut Brown Hare,",               zh:"那时我还是只小棕兔，" },
  { id:37, start:105.967, end:107.000, en:"just like you.",                                    zh:"就像你一样。" },
  { id:38, start:107.000, end:108.666, en:"It had more blossoms",                              zh:"它开的花" },
  { id:39, start:108.666, end:111.000, en:"than you could ever imagine.",                      zh:"比你想象的还要多。" },
  { id:40, start:111.000, end:113.245, en:"The tree is probably still there",                  zh:"那棵树大概还在那里，" },
  { id:41, start:113.245, end:115.000, en:"at the top of a mountain.",                         zh:"在山顶上。" },
  { id:42, start:115.000, end:116.509, en:"Oh, can you take us?",                              zh:"哦，你能带我们去吗？" },
  { id:43, start:116.509, end:119.000, en:"Can you show us the blossom tree?",                 zh:"带我们去看花树好吗？" },

  { id:50, start:132.000, end:135.000, en:"Stop when you get to the big boulder!",             zh:"到大石头那里就停下！" },
  { id:51, start:135.000, end:139.000, en:"You can't miss it, it's huge!",                     zh:"你不会错过的，它可大了！" },
  { id:52, start:140.000, end:143.000, en:"Do you think this could be the boulder?",           zh:"你觉得这会是那块大石头吗？" },
  { id:53, start:143.000, end:144.222, en:"It must be.",                                       zh:"应该是。" },
  { id:54, start:144.222, end:146.000, en:"It's pretty big.",                                  zh:"挺大的。" },
  { id:55, start:146.000, end:149.096, en:"This can't be the right boulder.",                  zh:"这不是那块石头。" },
  { id:56, start:149.096, end:152.000, en:"It's not as big as I remember.",                    zh:"没有我记忆中那么大。" },
  { id:57, start:152.000, end:155.166, en:"It looks big to me.",                               zh:"在我看来很大啊。" },
  { id:58, start:155.166, end:156.000, en:"Huge!",                                             zh:"巨大！" },
  { id:59, start:156.000, end:157.111, en:"Oh, I see.",                                        zh:"哦，我明白了。" },
  { id:60, start:157.111, end:158.222, en:"It must be",                                        zh:"一定是因为" },
  { id:61, start:158.222, end:161.444, en:"because last time I was here,",                     zh:"上次我来这里时，" },
  { id:62, start:161.444, end:163.000, en:"I was smaller.",                                    zh:"我比现在小。" },
  { id:63, start:163.000, end:166.000, en:"So the boulder only seemed bigger.",                zh:"所以石头只是看起来更大而已。" },
  { id:64, start:166.000, end:166.954, en:"So why have we",                                    zh:"那我们为什么" },
  { id:65, start:166.954, end:169.000, en:"stopped at the boulder anyway?",                    zh:"要在石头这里停下来？" },
  { id:66, start:169.000, end:170.276, en:"We have to turn here",                              zh:"我们要从这里转弯，" },
  { id:67, start:170.276, end:172.000, en:"to get to the blossom tree.",                       zh:"才能到花树那里。" },
  { id:68, start:172.000, end:174.000, en:"We're nearly there!",                               zh:"快到了！" },
  { id:69, start:174.000, end:174.625, en:"Oh no!",                                            zh:"哦不！" },
  { id:70, start:174.625, end:179.000, en:"Where the path becomes too uphill is true.",        zh:"路变得太陡了，是真的。" },
  { id:71, start:179.000, end:182.000, en:"How does that tell us where to go?",                zh:"那怎么告诉我们往哪里走呢？" },
];

// State
let currentIdx = -1;
let loopActive = false;
let showEn = true;
let showZh = true;
const speeds = [0.5, 0.75, 1, 1.25, 1.5];
let speedIdx = 2;

// Elements
const video       = document.getElementById('video');
const dropZone    = document.getElementById('drop-zone');
const subDisplay  = document.getElementById('sub-display');
const subList     = document.getElementById('sub-list');
const btnPlay     = document.getElementById('btn-play');
const iconPlay    = document.getElementById('icon-play');
const iconPause   = document.getElementById('icon-pause');
const btnLoop     = document.getElementById('btn-loop');
const btnEn       = document.getElementById('btn-en');
const btnZh       = document.getElementById('btn-zh');
const btnSpeed    = document.getElementById('btn-speed');
const progressWrap= document.getElementById('progress-wrap');
const progressFill= document.getElementById('progress-fill');
const timeLabel   = document.getElementById('time-label');
const fileInput   = document.getElementById('file-input');

// Build subtitle list
subtitles.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'sub-item';
  el.dataset.idx = i;
  el.innerHTML = `
    <span class="sub-item-time">${fmt(s.start)}</span>
    <span class="sub-item-en">${s.en}</span>
    <span class="sub-item-zh">${s.zh}</span>
  `;
  el.addEventListener('click', () => {
    video.currentTime = s.start;
    if (video.paused) video.play();
  });
  subList.appendChild(el);
});

function fmt(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}
function fmtFull(sec) {
  if (!isFinite(sec)) return '0:00';
  return fmt(sec);
}

// Time update
video.addEventListener('timeupdate', () => {
  const t = video.currentTime;

  // Progress bar
  if (video.duration) {
    progressFill.style.width = (t / video.duration * 100) + '%';
    timeLabel.textContent = fmtFull(t) + ' / ' + fmtFull(video.duration);
  }

  // Find current subtitle
  let found = -1;
  for (let i = 0; i < subtitles.length; i++) {
    if (t >= subtitles[i].start && t < subtitles[i].end) { found = i; break; }
  }

  // Loop mode
  if (loopActive && currentIdx >= 0 && found !== currentIdx && t >= subtitles[currentIdx].end) {
    video.currentTime = subtitles[currentIdx].start;
    return;
  }

  if (found === currentIdx) return;
  currentIdx = found;
  updateSubtitleUI();
});

function updateSubtitleUI() {
  // Update display panel
  if (currentIdx < 0) {
    subDisplay.innerHTML = '<span class="sub-empty">字幕将在此处显示</span>';
  } else {
    const s = subtitles[currentIdx];
    let html = '';
    if (showEn) html += `<div class="sub-en">${s.en}</div>`;
    if (showZh) html += `<div class="sub-zh">${s.zh}</div>`;
    subDisplay.innerHTML = html || '<span class="sub-empty">字幕已隐藏</span>';
  }

  // Update list
  document.querySelectorAll('.sub-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
    const enEl = el.querySelector('.sub-item-en');
    const zhEl = el.querySelector('.sub-item-zh');
    if (enEl) enEl.style.display = showEn ? '' : 'none';
    if (zhEl) zhEl.style.display = showZh ? '' : 'none';
  });

  // Auto-scroll list
  if (currentIdx >= 0) {
    const activeEl = subList.children[currentIdx];
    if (activeEl) {
      activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

// Show/hide toggle buttons
function updateVisibility() {
  document.querySelectorAll('.sub-item-en').forEach(el => el.style.display = showEn ? '' : 'none');
  document.querySelectorAll('.sub-item-zh').forEach(el => el.style.display = showZh ? '' : 'none');
  updateSubtitleUI();
}

btnEn.addEventListener('click', () => {
  showEn = !showEn;
  btnEn.classList.toggle('active', !showEn);
  updateVisibility();
});
btnZh.addEventListener('click', () => {
  showZh = !showZh;
  btnZh.classList.toggle('active', !showZh);
  updateVisibility();
});

// Loop
btnLoop.addEventListener('click', () => {
  loopActive = !loopActive;
  btnLoop.classList.toggle('active', loopActive);
});

// Play/pause
btnPlay.addEventListener('click', () => {
  if (video.paused) video.play(); else video.pause();
});
video.addEventListener('play', () => {
  iconPlay.style.display = 'none';
  iconPause.style.display = '';
});
video.addEventListener('pause', () => {
  iconPlay.style.display = '';
  iconPause.style.display = 'none';
});

// Speed
btnSpeed.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  video.playbackRate = speeds[speedIdx];
  btnSpeed.textContent = speeds[speedIdx] + '×';
});

// Progress seek
progressWrap.addEventListener('click', e => {
  if (!video.duration) return;
  const rect = progressWrap.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  video.currentTime = ratio * video.duration;
});

// File input
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  loadVideo(file);
});

function loadVideo(file) {
  const url = URL.createObjectURL(file);
  video.src = url;
  video.style.display = 'block';
  dropZone.classList.add('hidden');
  video.play();
}

// Drag & drop
const videoCol = document.querySelector('.video-col');
videoCol.addEventListener('dragover', e => { e.preventDefault(); });
videoCol.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('video/')) loadVideo(file);
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (video.paused) video.play(); else video.pause(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); video.currentTime += 5; }
  if (e.code === 'ArrowLeft')  { e.preventDefault(); video.currentTime -= 5; }
  if (e.code === 'KeyL') { btnLoop.click(); }
  if (e.code === 'KeyR' && currentIdx >= 0) { video.currentTime = subtitles[currentIdx].start; }
});
</script>
</body>
</html>
